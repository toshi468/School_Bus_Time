<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大学スクールバス時刻</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="header">
        <p class="link"><a href="https://www.fukuyama-u.ac.jp/campuslife/student-affairs/attending-school/" target="_blank" rel="noopener noreferrer">元の時刻表はこちら</a></p>
        <p class="wall">|</p>
        <h1 class="title">大学スクールバス時刻表(目安)</h1>
    </div>
    <div class="now">
        <h2 class="now_day">日付 : </h2>
        <h2 class="now_time">現在時刻 : </h2>
    </div>
    <div class="kanban">
        <div class="from">
            <div class="bus_title from_university">
              <h2 class="where_to">大学 ⇒ 駅</h2>
              <div class="bus_now_next">
                <h3 class="now_plan">今 : </h3>
                <h3 class="next_plan">次 : </h3>
              </div>
            </div>
            <div class="gauge from_university">
              <div class="progress">
                <div class="bar"></div>
                <div class="bar2"></div>
                <div class="bar-white"></div>
              </div>
              <div class="time_status"></div>
              <div class="time_flame">
                <p class="time"></p>
                <p class="seconds"></p>
              </div>
            </div>
            <div class="container university">
              <div class="content">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
                <div class="face left"></div>
                <div class="face right"></div>
              </div>
            </div>
        </div>
        <div class="from">
            <div class="bus_title from_station">
              <h2 class="where_to">駅 ⇒ 大学</h2>
              <div class="bus_now_next">
                <h3 class="now_plan">今 : </h3>
                <h3 class="next_plan">次 : </h3>
              </div>
            </div>
            <div class="gauge from_station">
              <div class="progress">
                <div class="bar"></div>
                <div class="bar2"></div>
                <div class="bar-white"></div>
              </div>
              <div class="time_status"></div>
              <div class="time_flame">
                <p class="time"></p>
                <p class="seconds"></p>
              </div>
            </div>
            <div class="container station">
              <div class="content">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
                <div class="face left"></div>
                <div class="face right"></div>
              </div>
            </div>
          </div>
    </div>
    </div>
    <div class="bussAnimation">
      <div class="Buss_left_container">
        <img class="Buss_left" src="image/Buss.png" alt="Buss" />
        <img class="Sleep" src="image/Buss_Sleep.png" alt="Zzz">
      </div>
      <div class="Buss_right_container">
        <img class="Buss_right" src="image/Buss.png" alt="Buss" />
        <img class="Sleep" src="image/Buss_Sleep.png" alt="Zzz">
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
